    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F7F3EC" />
    <title>LaserBatcher</title>
    <meta name="description" content="Arrange SVG copies for laser cutting, scoring and engraving. Map or ignore operations, preview batches, and edit program metadata and estimated runtime locally in your browser." />
    <base href="/" />
    <script src="theme.js"></script>
    <link href="lib/bootstrap/css/bootstrap.min.css" rel="stylesheet" />
    <link href="lib/iconoir/css/iconoir.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />

    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />

<body>
    <div id="app">
        <div class="startup-placeholder">
        <div class="loading-brand">
            <img src="brand/laserbatcher.svg" width="64" height="64" alt="" />
            <h1>LaserBatcher</h1>
            <p>Arrange SVG copies for laser cutting, scoring and engraving.</p>
            <p>Map or ignore operations, inspect your batch, and edit program metadata and estimated runtime. Your SVG files are processed locally in your browser.</p>
            <p id="startup-status" role="status">Opening the interactive workspace…</p>
            <noscript><p>This workspace requires JavaScript. Enable it in your browser, then reload this page.</p></noscript>
        </div>
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
        </div>
    </div>

    <!-- Populated only when a browser observes an actual startup/runtime error. -->
    <div id="blazor-error-ui" role="alert" style="display:none"></div>
    <aside id="app-update-notice" role="status" hidden></aside>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script src="lib/jquery/jquery.min.js"></script>
    <script src="lib/bootstrap/js/bootstrap.min.js"></script>
    <script src="dpi.js"></script>
    <script src="saveAs.js"></script>
    <script src="sendCustomEvent.js"></script>
    <script src="startup.js"></script>
