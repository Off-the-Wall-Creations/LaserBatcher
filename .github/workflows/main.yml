name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-to-github-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        
      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: 7.0.x
          
      - name: Test metadata parsing and SVG exports
        run: dotnet test LaserBatcher.Tests/LaserBatcher.Tests.csproj -c Release --nologo

      - name: Test Pages deployment checks
        run: node --test LaserBatcher.Tests/pages-deployment.test.cjs

      # This repository's custom domain serves the app at /, not /LaserBatcher/.
      # Keep wwwroot/index.html's base tag unchanged so the PWA hash stays valid.
      - name: Publish .NET Core Project
        run: dotnet publish LaserBatcher/LaserBatcher.csproj -c Release -o release --nologo

      # Verify paths and all generated integrity hashes before deploying. Only
      # add Pages support files; never rewrite already-hashed published assets.
      - name: Prepare and verify GitHub Pages output
        run: node tools/prepare-pages.cjs release/wwwroot
      
      - name: Commit wwwroot to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@3.7.1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: gh-pages
          FOLDER: release/wwwroot
