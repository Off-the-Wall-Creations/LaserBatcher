<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-4X5DN7KDYD"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-4X5DN7KDYD');
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F7F3EC" />
    <title>LaserBatcher</title>
    <base href="/" />
    <script src="theme.js"></script>
    <link href="lib/bootstrap/css/bootstrap.min.css" rel="stylesheet" />
    <link href="lib/iconoir/css/iconoir.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="css/workspace.css" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="brand/laserbatcher.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
    <link href="LaserBatcher.styles.css" rel="stylesheet" />
    <link href="manifest.json" rel="manifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
</head>

<body>
    <div id="app">
        <div class="loading-brand"><img src="brand/laserbatcher.svg" width="64" height="64" alt="" /><h1>LaserBatcher</h1><p>Preparing your workspace</p></div>
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' })
                .catch(error => console.warn('LaserBatcher offline support is unavailable.', error));
        }
    </script>
    <script src="lib/jquery/jquery.min.js"></script>
    <script src="lib/bootstrap/js/bootstrap.min.js"></script>
    <script src="dpi.js"></script>
    <script src="saveAs.js"></script>
    <script src="sendCustomEvent.js"></script>
</body>

</html>
